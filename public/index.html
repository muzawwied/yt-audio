<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0f0b1a" />
<title>Putar Audio YouTube</title>
<link rel="manifest" href="/manifest.webmanifest" />
<style>
  :root {
    --bg: #0f0b1a;
    --surface: #171226;
    --surface-2: #1f1833;
    --line: #2c2443;
    --text: #f2eefa;
    --muted: #a79ec4;
    --accent: #8b5cf6;
    --accent-2: #22d3ee;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
  body { padding: 18px 16px 130px; min-height: 100vh; }
  h1 { font-size: 19px; margin: 4px 0 3px; letter-spacing: -0.2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

  .paste { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
  textarea {
    width: 100%; min-height: 76px; resize: vertical; background: var(--surface-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; font-size: 14px; font-family: inherit;
    line-height: 1.45;
  }
  textarea::placeholder { color: #6f668c; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 9px; margin-top: 10px; }
  button {
    font-family: inherit; font-size: 14px; font-weight: 600; border: 0; border-radius: 12px;
    padding: 12px 16px; cursor: pointer; transition: transform .06s ease, opacity .15s ease;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: .55; cursor: default; }
  .primary { background: linear-gradient(135deg, #8b5cf6, #6366f1); color: #fff; flex: 1; }
  .ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }

  .msg { margin-top: 10px; font-size: 13px; min-height: 18px; }
  .msg.err { color: #fb7185; }
  .msg.ok { color: #34d399; }

  .list { margin-top: 20px; }
  .list-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .list-head span { color: var(--muted); font-size: 12.5px; }
  .track {
    display: flex; gap: 11px; align-items: center; background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 9px; margin-bottom: 8px;
  }
  .track.active { border-color: var(--accent); background: #1c1430; }
  .track img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: var(--surface-2); flex: 0 0 auto; }
  .meta { min-width: 0; flex: 1; }
  .meta .t { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .a { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .del { background: transparent; color: var(--muted); font-size: 18px; padding: 6px 8px; line-height: 1; }
  .empty { color: var(--muted); font-size: 13px; padding: 14px 2px; }

  .player {
    position: fixed; left: 0; right: 0; bottom: 0; background: rgba(23,18,38,.97);
    backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 10px 14px 14px;
  }
  .np { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .np img { width: 42px; height: 42px; border-radius: 9px; object-fit: cover; background: var(--surface-2); }
  .np .info { min-width: 0; flex: 1; }
  .np .title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np .artist { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .controls { display: flex; align-items: center; gap: 8px; }
  .controls button { background: var(--surface-2); color: var(--text); padding: 9px 12px; font-size: 15px; }
  .controls .play { background: linear-gradient(135deg, #8b5cf6, #6366f1); width: 46px; height: 46px; border-radius: 50%; padding: 0; font-size: 18px; }
  .bar { flex: 1; height: 5px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #8b5cf6, #22d3ee); }
  .time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 78px; text-align: right; }
</style>
</head>
<body>
  <h1>Putar audio YouTube</h1>
  <div class="sub">Tempel satu atau beberapa tautan, lalu putar. Tetap bunyi saat layar dikunci.</div>

  <div class="paste">
    <textarea id="input" placeholder="https://www.youtube.com/watch?v=...&#10;boleh beberapa baris sekaligus"></textarea>
    <div class="row">
      <button class="primary" id="add">Tambahkan</button>
      <button class="ghost" id="clear" title="Kosongkan daftar">Hapus semua</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="list">
    <div class="list-head"><strong style="font-size:14px">Daftar putar</strong><span id="count"></span></div>
    <div id="tracks"></div>
  </div>

  <div class="player">
    <div class="np">
      <img id="np-thumb" alt="" />
      <div class="info">
        <div class="title" id="np-title">Belum ada yang diputar</div>
        <div class="artist" id="np-artist">Tempel tautan di atas</div>
      </div>
    </div>
    <div class="controls">
      <button id="prev" title="Sebelumnya">⏮</button>
      <button class="play" id="play" title="Putar">▶</button>
      <button id="next" title="Berikutnya">⏭</button>
      <div class="bar"><i id="progress"></i></div>
      <div class="time" id="time">0:00 / 0:00</div>
    </div>
  </div>

  <audio id="audio" preload="auto"></audio>

<script>
(function () {
  var KEY = 'ytaudio.queue.v1';
  var queue = [];
  var index = -1;
  var resolving = false;

  var audio = document.getElementById('audio');
  var elTracks = document.getElementById('tracks');
  var elMsg = document.getElementById('msg');
  var elCount = document.getElementById('count');
  var input = document.getElementById('input');
  var btnAdd = document.getElementById('add');
  var btnPlay = document.getElementById('play');
  var npTitle = document.getElementById('np-title');
  var npArtist = document.getElementById('np-artist');
  var npThumb = document.getElementById('np-thumb');
  var progress = document.getElementById('progress');
  var timeEl = document.getElementById('time');

  function fmt(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(queue.map(function (t) {
        return { id: t.id, title: t.title, artist: t.artist, thumb: t.thumb, duration: t.duration, stream: t.stream };
      })));
    } catch (e) {}
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      queue = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(queue)) queue = [];
    } catch (e) { queue = []; }
  }

  function setMsg(text, kind) {
    elMsg.textContent = text || '';
    elMsg.className = 'msg' + (kind ? ' ' + kind : '');
  }

  function render() {
    elTracks.innerHTML = '';
    elCount.textContent = queue.length ? queue.length + ' lagu' : '';
    if (!queue.length) {
      var d = document.createElement('div');
      d.className = 'empty';
      d.textContent = 'Belum ada lagu. Tempel tautan YouTube di atas.';
      elTracks.appendChild(d);
      return;
    }
    queue.forEach(function (t, i) {
      var row = document.createElement('div');
      row.className = 'track' + (i === index ? ' active' : '');
      var img = document.createElement('img');
      img.src = t.thumb || '';
      img.alt = '';
      img.loading = 'lazy';
      var meta = document.createElement('div');
      meta.className = 'meta';
      var tt = document.createElement('div');
      tt.className = 't';
      tt.textContent = t.title || 'Tanpa judul';
      var aa = document.createElement('div');
      aa.className = 'a';
      aa.textContent = (t.artist || 'YouTube') + (t.duration ? ' · ' + fmt(t.duration) : '');
      meta.appendChild(tt);
      meta.appendChild(aa);
      var del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.textContent = '×';
      del.setAttribute('aria-label', 'Hapus');
      del.addEventListener('click', function (ev) {
        ev.stopPropagation();
        removeAt(i);
      });
      row.appendChild(img);
      row.appendChild(meta);
      row.appendChild(del);
      row.addEventListener('click', function () { playAt(i); });
      elTracks.appendChild(row);
    });
  }

  function removeAt(i) {
    queue.splice(i, 1);
    if (i === index) {
      audio.pause();
      index = -1;
      updateNowPlaying(null);
    } else if (i < index) {
      index--;
    }
    save();
    render();
  }

  function updateNowPlaying(t) {
    if (!t) {
      npTitle.textContent = 'Belum ada yang diputar';
      npArtist.textContent = 'Tempel tautan di atas';
      npThumb.removeAttribute('src');
      document.title = 'Putar Audio YouTube';
      if ('mediaSession' in navigator) { try { navigator.mediaSession.metadata = null; } catch (e) {} }
      return;
    }
    npTitle.textContent = t.title || 'Tanpa judul';
    npArtist.textContent = t.artist || 'YouTube';
    // Tampilkan durasi dari data lagu supaya tidak terlihat 0:00 sebelum audio siap
    timeEl.textContent = '0:00 / ' + fmt(t.duration || 0);
    if (t.thumb) npThumb.src = t.thumb; else npThumb.removeAttribute('src');
    document.title = (t.title || 'Audio') + ' · Putar Audio';
    if ('mediaSession' in navigator && window.MediaMetadata) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: t.title || 'Tanpa judul',
          artist: t.artist || 'YouTube',
          album: 'YouTube',
          artwork: t.thumb ? [{ src: t.thumb, sizes: '480x360', type: 'image/jpeg' }] : []
        });
      } catch (e) {}
    }
  }

  async function playAt(i) {
    if (i < 0 || i >= queue.length) return;
    var t = queue[i];
    index = i;
    render();
    updateNowPlaying(t);
    loadRetry = 0;
    audio.preload = 'auto';
    audio.src = t.stream;
    try {
      await audio.play();
      btnPlay.textContent = '⏸';
    } catch (e) {
      btnPlay.textContent = '▶';
      setMsg('Ketuk tombol putar sekali lagi kalau browser memblokir autoplay.', 'err');
    }
  }

  // Blokir bot YouTube bersifat acak per IP: coba ulang beberapa kali dengan jeda,
  // supaya permintaan mendarat di server Cloudflare yang berbeda.
  async function resolveWithRetry(url, maxTry) {
    maxTry = maxTry || 4;
    var lastErr = null;
    for (var attempt = 1; attempt <= maxTry; attempt++) {
      try {
        var res = await fetch('/api/resolve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url })
        });
        var data = await res.json();
        if (res.ok) return data;
        lastErr = new Error(data.error || 'Gagal mengambil audio.');
        if (!/blokir bot|sign in|not a bot/i.test(lastErr.message)) throw lastErr;
      } catch (e) {
        lastErr = e;
        if (!/blokir bot|sign in|not a bot|Failed to fetch/i.test(e.message || '')) throw e;
      }
      if (attempt < maxTry) {
        setMsg('YouTube menolak sementara, mencoba lagi (' + attempt + '/' + (maxTry - 1) + ')…');
        await new Promise(function (r) { setTimeout(r, 1200 + attempt * 900); });
      }
    }
    throw lastErr || new Error('Gagal mengambil audio.');
  }

  async function addLinks() {
    var lines = input.value.split(/\s+/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (!lines.length) { setMsg('Tempel dulu tautan YouTube-nya.', 'err'); return; }
    btnAdd.disabled = true;
    setMsg('');
    var added = 0;
    for (var i = 0; i < lines.length; i++) {
      var url = lines[i];
      if (!/youtu\.?be/.test(url)) { continue; }
      setMsg('Mengambil lagu ' + (added + 1) + ' dari ' + lines.length + '…');
      try {
        var data = await resolveWithRetry(url);
        if (!queue.some(function (q) { return q.id === data.id; })) {
          queue.push(data);
          added++;
        }
      } catch (e) {
        setMsg(e.message, 'err');
      }
    }
    btnAdd.disabled = false;
    input.value = '';
    save();
    render();
    if (added) {
      setMsg(added + ' lagu ditambahkan.', 'ok');
      if (index === -1) playAt(0);
    } else if (!elMsg.textContent) {
      setMsg('Tidak ada tautan YouTube yang terbaca.', 'err');
    }
  }

  btnAdd.addEventListener('click', addLinks);
  input.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') addLinks();
  });
  document.getElementById('clear').addEventListener('click', function () {
    audio.pause();
    queue = [];
    index = -1;
    updateNowPlaying(null);
    save();
    render();
    setMsg('Daftar dikosongkan.', 'ok');
  });

  btnPlay.addEventListener('click', function () {
    if (!queue.length) { setMsg('Daftar masih kosong.', 'err'); return; }
    if (index === -1) return playAt(0);
    if (audio.paused) {
      audio.play().then(function () { btnPlay.textContent = '⏸'; }).catch(function () {});
    } else {
      audio.pause();
      btnPlay.textContent = '▶';
    }
  });

  document.getElementById('next').addEventListener('click', function () {
    if (!queue.length) return;
    playAt((index + 1) % queue.length);
  });
  document.getElementById('prev').addEventListener('click', function () {
    if (!queue.length) return;
    playAt((index - 1 + queue.length) % queue.length);
  });

  audio.addEventListener('loadingdata', function () { loadRetry = 0; });
  audio.addEventListener('play', function () { btnPlay.textContent = '⏸'; });
  audio.addEventListener('pause', function () { btnPlay.textContent = '▶'; });
  audio.addEventListener('timeupdate', function () {
    var d = audio.duration || (queue[index] && queue[index].duration) || 0;
    var p = d ? (audio.currentTime / d) * 100 : 0;
    progress.style.width = Math.min(100, p) + '%';
    timeEl.textContent = fmt(audio.currentTime) + ' / ' + fmt(d);
  });
  audio.addEventListener('ended', function () {
    if (index + 1 < queue.length) playAt(index + 1);
    else btnPlay.textContent = '▶';
  });
  // Kalau audio gagal dimuat (mis. URL sumber kedaluwarsa / kena blokir sesaat),
  // coba muat ulang otomatis beberapa kali sebelum menyerah.
  var loadRetry = 0;
  audio.addEventListener('error', function () {
    var t = queue[index];
    if (t && loadRetry < 3) {
      loadRetry++;
      setMsg('Menyambung ulang audio (' + loadRetry + '/3)…');
      setTimeout(function () {
        audio.src = t.stream + '?r=' + Date.now();
        audio.play().then(function () { btnPlay.textContent = '⏸'; }).catch(function () {});
      }, 900 * loadRetry);
      return;
    }
    setMsg('Audio gagal dimuat. Tekan putar sekali lagi, kalau masih gagal coba lagu lain.', 'err');
  });

  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', function () { audio.play(); });
      navigator.mediaSession.setActionHandler('pause', function () { audio.pause(); });
      navigator.mediaSession.setActionHandler('nexttrack', function () {
        if (queue.length) playAt((index + 1) % queue.length);
      });
      navigator.mediaSession.setActionHandler('previoustrack', function () {
        if (queue.length) playAt((index - 1 + queue.length) % queue.length);
      });
    } catch (e) {}
  }

  load();
  render();
  if (queue.length) setMsg('Daftar tersimpan dipulihkan.', 'ok');
})();
</script>
</body>
</html>
